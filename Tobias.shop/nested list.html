<!DOCTYPE html>
<html>
    <head>
        <title>nested list</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>foods</h1>
        <ol type="1">
            <li>starches</li>
            <ul type="disc">
                <li>potatoes</li>
                <ol type="a">
                    <li>vitellote</li>
                    <li>yukon gold</li>
                    <li>russian blue</li>
                </ol>
                <li>flour</li>
                <ol type="A" reversed>
                    <li>wheat flour</li>
                    <li>maize flour</li>
                    <li>cassava flour</li>
                </ol>
            </ul>
            <li>protein</li>
            <ul type="square">
                <li>chicken</li>
                <ol>
                    <li>kienyeji</li>
                    <li>broiler</li>
                </ol>
                <li>beef</li>
                <ol>
                    <li>traditional</li>
                    <li>hybrid</li>
                </ol>
            </ul>
        </ol>
    </body>
</html>
